name: ContactLensLog
options:
  bundleIdPrefix: com.shimondeitel.lenslog
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  ContactLensLog:
    type: application
    platform: iOS
    sources:
      - path: ContactLensLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.lenslog
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ContactLensLog/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  ContactLensLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ContactLensLogTests
      - path: ContactLensLog.storekit
    dependencies:
      - target: ContactLensLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.lenslog.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  ContactLensLogUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ContactLensLogUITests
    dependencies:
      - target: ContactLensLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.lenslog.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  ContactLensLog:
    build:
      targets:
        ContactLensLog: all
        ContactLensLogTests: [test]
        ContactLensLogUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: ContactLensLog.storekit
    test:
      config: Debug
      storeKitConfiguration: ContactLensLog.storekit
      targets:
        - ContactLensLogTests
        - ContactLensLogUITests
    archive:
      config: Release
